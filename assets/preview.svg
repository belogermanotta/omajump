<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      .ui { font-family: Inter, system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .muted { fill: #8b93a7; }
      .hint text { fill: #f7f7f2; font: 700 22px 'JetBrains Mono', monospace; dominant-baseline: middle; text-anchor: middle; }
      .hint rect { fill: #000; fill-opacity: .7; stroke: #efd66f; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#desktop)"/>
  <circle cx="1320" cy="170" r="270" fill="#7c5cff" opacity=".08"/>
  <circle cx="180" cy="790" r="320" fill="#4cc9a8" opacity=".06"/>

  <!-- Omarchy bar -->
  <rect x="18" y="16" width="1564" height="48" rx="12" fill="#0c0f16" stroke="#292f3c"/>
  <circle cx="46" cy="40" r="9" fill="#efd66f"/>
  <text x="66" y="46" class="ui" font-size="18" font-weight="700" fill="#f5f5f5">OmaJump</text>
  <rect x="685" y="27" width="230" height="26" rx="13" fill="#191e29"/>
  <text x="800" y="45" class="ui" font-size="14" text-anchor="middle" fill="#bac1d1">Workspace 1 · Productivity</text>
  <text x="1538" y="46" class="mono" font-size="15" text-anchor="end" fill="#d8dbea">20:26</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="55" y="92" width="990" height="750" rx="14" fill="#11151d" stroke="#313847"/>
    <path d="M69 92h962a14 14 0 0 1 14 14v52H55v-52a14 14 0 0 1 14-14z" fill="#1a1f2a"/>
    <circle cx="84" cy="125" r="6" fill="#ef6b73"/><circle cx="106" cy="125" r="6" fill="#efd66f"/><circle cx="128" cy="125" r="6" fill="#52c98b"/>
    <rect x="184" y="108" width="674" height="34" rx="9" fill="#0d1017"/>
    <text x="521" y="130" class="ui muted" font-size="14" text-anchor="middle">plugins.omarchy.org</text>
    <text x="92" y="214" class="ui" font-size="18" font-weight="700" fill="#efd66f">OMARCHY PLUGINS</text>
    <text x="92" y="277" class="ui" font-size="43" font-weight="800" fill="#f4f5f7">Move at the speed</text>
    <text x="92" y="326" class="ui" font-size="43" font-weight="800" fill="#f4f5f7">of your keyboard.</text>
    <text x="92" y="372" class="ui muted" font-size="19">Semantic hints across every monitor, with accessible</text>
    <text x="92" y="399" class="ui muted" font-size="19">text search, scrolling, and paragraph copy.</text>
    <rect x="92" y="439" width="182" height="48" rx="8" fill="#efd66f"/>
    <text x="183" y="469" class="ui" font-size="17" font-weight="700" text-anchor="middle" fill="#161616">Explore plugins</text>
    <rect x="292" y="439" width="170" height="48" rx="8" fill="#1b202b" stroke="#3a4252"/>
    <text x="377" y="469" class="ui" font-size="17" font-weight="650" text-anchor="middle" fill="#e4e6eb">View source</text>

    <rect x="92" y="540" width="279" height="230" rx="12" fill="#181d27" stroke="#303746"/>
    <rect x="391" y="540" width="279" height="230" rx="12" fill="#181d27" stroke="#303746"/>
    <rect x="690" y="540" width="279" height="230" rx="12" fill="#181d27" stroke="#303746"/>
    <circle cx="132" cy="582" r="18" fill="#efd66f" opacity=".9"/><circle cx="431" cy="582" r="18" fill="#62c8ff" opacity=".9"/><circle cx="730" cy="582" r="18" fill="#9e83ff" opacity=".9"/>
    <text x="116" y="632" class="ui" font-size="20" font-weight="700" fill="#f3f4f6">Every screen</text>
    <text x="415" y="632" class="ui" font-size="20" font-weight="700" fill="#f3f4f6">Search text</text>
    <text x="714" y="632" class="ui" font-size="20" font-weight="700" fill="#f3f4f6">Copy paragraphs</text>
    <text x="116" y="672" class="ui muted" font-size="16">Labels span visible apps</text><text x="116" y="697" class="ui muted" font-size="16">across every monitor.</text>
    <text x="415" y="672" class="ui muted" font-size="16">Type a phrase, press Enter,</text><text x="415" y="697" class="ui muted" font-size="16">and click the best match.</text>
    <text x="714" y="672" class="ui muted" font-size="16">Choose accessible prose and</text><text x="714" y="697" class="ui muted" font-size="16">send it to the clipboard.</text>
  </g>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="1075" y="92" width="470" height="750" rx="14" fill="#090c11" stroke="#313847"/>
    <path d="M1089 92h442a14 14 0 0 1 14 14v52h-470v-52a14 14 0 0 1 14-14z" fill="#1a1f2a"/>
    <text x="1111" y="130" class="mono" font-size="15" fill="#d5d8e0">~/omajump</text>
    <text x="1111" y="208" class="mono" font-size="16" fill="#65d5a5">$</text><text x="1132" y="208" class="mono" font-size="16" fill="#d5d8e0">omarchy plugin validate .</text>
    <text x="1111" y="244" class="mono" font-size="16" fill="#8b93a7">✓ manifest</text>
    <text x="1111" y="274" class="mono" font-size="16" fill="#8b93a7">✓ overlay entry point</text>
    <text x="1111" y="304" class="mono" font-size="16" fill="#8b93a7">✓ plugin id</text>
    <text x="1111" y="356" class="mono" font-size="16" fill="#65d5a5">$</text><text x="1132" y="356" class="mono" font-size="16" fill="#d5d8e0">python -m unittest</text>
    <text x="1111" y="392" class="mono" font-size="16" fill="#8b93a7">Ran 29 tests in 0.08s</text>
    <text x="1111" y="422" class="mono" font-size="16" fill="#65d5a5">OK</text>
    <rect x="1110" y="486" width="400" height="232" rx="10" fill="#10151d" stroke="#2d3544"/>
    <path d="M1243 486v232M1377 486v232M1110 563h400M1110 641h400" stroke="#efd66f" stroke-opacity=".28"/>
    <text x="1310" y="758" class="ui muted" font-size="15" text-anchor="middle">Pointer-grid fallback</text>
  </g>

  <!-- Actual OmaJump-style hint badges (70% black) -->
  <g class="hint">
    <g transform="translate(68 109)"><rect width="36" height="32" rx="5"/><text x="18" y="17">a</text></g>
    <g transform="translate(700 24)"><rect width="36" height="32" rx="5"/><text x="18" y="17">b</text></g>
    <g transform="translate(92 439)"><rect width="36" height="32" rx="5"/><text x="18" y="17">c</text></g>
    <g transform="translate(292 439)"><rect width="36" height="32" rx="5"/><text x="18" y="17">d</text></g>
    <g transform="translate(92 540)"><rect width="36" height="32" rx="5"/><text x="18" y="17">e</text></g>
    <g transform="translate(391 540)"><rect width="36" height="32" rx="5"/><text x="18" y="17">f</text></g>
    <g transform="translate(690 540)"><rect width="36" height="32" rx="5"/><text x="18" y="17">g</text></g>
    <g transform="translate(1075 109)"><rect width="36" height="32" rx="5"/><text x="18" y="17">h</text></g>
    <g transform="translate(1159 502)"><rect width="36" height="32" rx="5"/><text x="18" y="17">i</text></g>
    <g transform="translate(1292 580)"><rect width="36" height="32" rx="5"/><text x="18" y="17">j</text></g>
    <g transform="translate(1426 658)"><rect width="36" height="32" rx="5"/><text x="18" y="17">k</text></g>
  </g>

  <rect x="527" y="804" width="546" height="54" rx="9" fill="#050607" fill-opacity=".84" stroke="#efd66f"/>
  <text x="800" y="837" class="mono" font-size="17" text-anchor="middle" fill="#f5f5f2">Type a hint · Backspace edits · Escape closes</text>
</svg>
